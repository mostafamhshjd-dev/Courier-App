name: Build Android APK & Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Deploy web app to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /shipping-system.codix.uk/htdocs/courier-app/

      - name: Prepare Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Android Launcher Icons & Splash from WebStack Logo
        run: npx capacitor-assets generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF' --splashBackgroundColor '#FFFFFF' --splashBackgroundColorDark '#0F172A'

      - name: Ensure GPS & Internet permissions in AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in \
            "android.permission.INTERNET" \
            "android.permission.ACCESS_FINE_LOCATION" \
            "android.permission.ACCESS_COARSE_LOCATION"; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s|<application|    <uses-permission android:name=\"$PERM\" />\n    <application|" "$MANIFEST"
            fi
          done
          cat "$MANIFEST"

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: courier-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
